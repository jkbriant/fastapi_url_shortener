{% extends "layout.html" %}
{% block content %}
    <div class="bg-white p-8 rounded-lg shadow-md max-w-md w-full text-center">
        <h1 class="text-4xl font-bold text-red-500 mb-2">{{ status_code }}</h1>
        <h2 class="text-xl font-semibold text-gray-800 mb-4">Oops!</h2>
        <p class="text-gray-600 mb-6">{{ message }}</p>
        <a href="/" class="inline-block bg-blue-500 text-white font-medium py-2 px-4 rounded-md hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
            Go Home
        </a>
    </div>
{% endblock content %}
