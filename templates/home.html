{% extends "layout.html" %}
{% block content %}
    <div class="p-6 w-full">
        <!-- Title -->
        <div class="text-center py-6">
            <h1 class="text-4xl font-bold">URL Shortener</h1>
            <p>Joshua Briant</p>
        </div>

        <!-- Form to shorten new URL -->
        <form method="POST" action="/" class="flex gap-2">
            <input type="text" name="url" placeholder="https://example.com"
                class="flex-1 px-3 rounded-md border">
            <button type="submit" 
                class="font-semibold bg-blue-500 hover:bg-blue-700 text-white py-3 px-6 rounded-md">
                Shorten URL
            </button>
        </form>

        <!-- URL History -->
        <div class="pt-6">
            <h2 class="text-xl font-bold">Recent URLs</h2>
            <div>
                {% for post in posts %}
                    <div class="flex items-center justify-between border px-3 my-3 hover:bg-gray-50">
                        <div class="flex-1 py-2">
                            <div>
                                <a href="{{ post.content }}" class="font-semibold hover:text-blue-800 text-blue-500">{{ request.base_url }}r/{{ post.title }}</a>
                            </div>
                            <span class="">{{ post.content }}</span>
                        </div>
                        <div class="flex-2">
                            <button type="submit" 
                                class="font-semibold bg-gray-500 hover:bg-gray-700 text-white py-2 px-4 rounded-md"
                                onclick="copyToClipboard('{{ request.base_url }}r/{{ post.title }}')">
                                Copy
                            </button>
                        </div>
                    </div>
                {% else %}
                    <p class="text-gray-500 text-center py-8">No URLs shortened yet. Enter one above!</p>
                {% endfor %}
            </div>
        </div>
    </div>

    <script>
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert('Copied to link to clipboard!');
            }).catch(err => {
                console.error('Failed to copy:', err);
            });
        }
    </script>
{% endblock content %}
