{% extends "layout.html" %}
{% block content %}
    <div class="bg-white p-8 rounded-lg shadow-md max-w-2xl w-full">
        <h1 class="text-3xl font-bold text-gray-800 mb-6 text-center">URL Shortener</h1>
        
        <!-- Form to shorten new URL -->
        <form method="POST" action="/" class="mb-8 space-y-4">
            <div class="flex gap-2">
                <input type="text" name="url" placeholder="https://example.com" required
                    class="flex-1 px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:border-blue-500">
                <button type="submit" 
                    class="bg-blue-500 text-white font-semibold py-3 px-6 rounded-md hover:bg-blue-600 focus:outline-none focus:ring-2 transition-colors">
                    Shorten
                </button>
            </div>
        </form>

        <!-- URL History -->
        <div class="border-t pt-6">
            <h2 class="font-bold text-gray-800 py-2 pl-2">Recent URLs</h2>
            
            {% for post in posts %}
                <div class="flex items-center justify-between py-3 border-b last:border-b-0 hover:bg-gray-50">
                    <div class="flex-1 min-w-0 mr-4 pl-2">
                        <div class="flex items-center gap-2">
                            <a href="{{ post.content }}" class="font-semibold text-blue-600 text-sm">{{ request.base_url }}r/{{ post.title }}</a>
                        </div>
                        <span class="text-gray-600 text-sm">
                            {{ post.content }}
                        </span>
                    </div>
                    <button onclick="copyToClipboard('{{ request.base_url }}r/{{ post.title }}')" 
                        class="text-gray-500 hover:text-blue-600 pr-5 rounded-md hover:bg-blue-50 transition-colors"
                        title="Copy to clipboard">
                        <!-- <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                        </svg> -->
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-5">
                            <path d="M7.5 3.375c0-1.036.84-1.875 1.875-1.875h.375a3.75 3.75 0 0 1 3.75 3.75v1.875C13.5 8.161 14.34 9 15.375 9h1.875A3.75 3.75 0 0 1 21 12.75v3.375C21 17.16 20.16 18 19.125 18h-9.75A1.875 1.875 0 0 1 7.5 16.125V3.375Z" />
                            <path d="M15 5.25a5.23 5.23 0 0 0-1.279-3.434 9.768 9.768 0 0 1 6.963 6.963A5.23 5.23 0 0 0 17.25 7.5h-1.875A.375.375 0 0 1 15 7.125V5.25ZM4.875 6H6v10.125A3.375 3.375 0 0 0 9.375 19.5H16.5v1.125c0 1.035-.84 1.875-1.875 1.875h-9.75A1.875 1.875 0 0 1 3 20.625V7.875C3 6.839 3.84 6 4.875 6Z" />
                        </svg>
                    </button>
                </div>
            {% else %}
                <p class="text-gray-500 text-center py-8">No URLs shortened yet. Enter one above!</p>
            {% endfor %}
        </div>
    </div>

    <script>
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                // Create a temporary toast notification
                const toast = document.createElement('div');
                toast.className = 'fixed bottom-4 right-4 bg-green-500 text-white px-4 py-2 rounded-md shadow-lg z-50';
                toast.textContent = 'Copied to clipboard!';
                document.body.appendChild(toast);
                
                setTimeout(() => {
                    toast.remove();
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy:', err);
            });
        }
    </script>
{% endblock content %}
