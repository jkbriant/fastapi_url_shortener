{% extends "layout.html" %}
{% block content %}
    <div class="bg-white p-8 rounded-lg shadow-md max-w-md w-full">
        <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">URL Shortener</h1>
        <form method="POST" class="space-y-4">
            <label for="url" class="block text-sm font-medium text-gray-700">Enter URL to shorten:</label>
            <input type="url" name="url" id="url" placeholder="https://example.com" required
                class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            <button type="submit" 
                class="w-full bg-blue-500 text-white font-medium py-2 px-4 rounded-md hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                Shorten
            </button>
        </form>
    </div>
{% endblock content %}
